<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#6366F1;#4F46E5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#DB2777;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glass">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="white" stop-opacity=".9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" rx="24" fill="url(#bg)"/>

  <!-- floating particles -->
  <g opacity=".55">
    <circle cx="140" cy="80" r="4" fill="white">
      <animate attributeName="cy" values="80;55;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="300" r="5" fill="white">
      <animate attributeName="cy" values="300;275;300" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1250" cy="90" r="5" fill="white">
      <animate attributeName="cy" values="90;60;90" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1480" cy="320" r="4" fill="white">
      <animate attributeName="cy" values="320;290;320" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass card -->
  <rect x="160" y="70" width="1280" height="280" rx="30"
        fill="white" fill-opacity=".08"
        stroke="white" stroke-opacity=".18"/>

  <text x="800" y="145"
        text-anchor="middle"
        font-size="24"
        fill="#FDE68A"
        font-family="Segoe UI, Arial"
        font-weight="700">
    👋 Welcome to my GitHub
  </text>

  <text x="800" y="215"
        text-anchor="middle"
        font-size="56"
        fill="white"
        font-family="Segoe UI, Arial"
        font-weight="800">
    VINAY CHANDRA NAYAK
  </text>

  <text x="800" y="255"
        text-anchor="middle"
        font-size="24"
        fill="#E9D5FF"
        font-family="Segoe UI, Arial">
    AI Intern • Full Stack Developer • Open Source Contributor
  </text>

  <text x="800" y="305"
        text-anchor="middle"
        font-size="22"
        fill="white"
        font-family="Segoe UI, Arial">
    🚀 Building InternPool • Exploring AI • Shipping Real Products
  </text>

  <g transform="translate(540,330)">
    <rect width="120" height="34" rx="17" fill="#ffffff22" stroke="#ffffff44"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">React</text>
  </g>

  <g transform="translate(680,330)">
    <rect width="120" height="34" rx="17" fill="#ffffff22" stroke="#ffffff44"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">Python</text>
  </g>

  <g transform="translate(820,330)">
    <rect width="120" height="34" rx="17" fill="#ffffff22" stroke="#ffffff44"/>
    <text x="60" y="22" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">AI</text>
  </g>

  <g transform="translate(960,330)">
    <rect width="140" height="34" rx="17" fill="#ffffff22" stroke="#ffffff44"/>
    <text x="70" y="22" text-anchor="middle" fill="white" font-size="15" font-family="Segoe UI">Open Source</text>
  </g>
</svg>
