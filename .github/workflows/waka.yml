
name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          SHOW_TIME: true

          SHOW_TOTAL: true

          SHOW_LANGUAGE: true

          SHOW_PROFILE_VIEWS: false

          SHOW_OS: false

          SHOW_PROJECTS: true

          SHOW_EDITORS: true

          SHOW_LOC_CHART: true

          COMMIT_MESSAGE: Updated WakaTime Stats
